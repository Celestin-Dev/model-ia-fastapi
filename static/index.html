<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Détection véhicules en temps réel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            gap: 20px;
            margin: 20px;
        }
        #video-container {
            flex: 1;
        }
        #detections-table {
            flex: 1;
            max-width: 400px;
            border-collapse: collapse;
        }
        #detections-table th, #detections-table td {
            border: 1px solid #ccc;
            padding: 8px;
        }
        #detections-table th {
            background-color: #f0f0f0;
        }
        img {
            max-width: 640px;
            height: auto;
            border: 2px solid #000;
        }
        #notif-container {
            margin-top: 20px;
        }
        #notif-list p {
            margin: 0;
            padding: 2px 0;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <h2>🚗 Flux vidéo</h2>
        <img id="video-frame" src="">
        <div id="fps"></div>
        <div id="vehicle-count">Véhicules détectés: 0</div>
        <div id="log"></div>

        <!-- Section notifications -->
        <div id="notif-container">
            <h3>🔔 Notifications infractions</h3>
            <div id="notif-list"></div>
        </div>
    </div>

    <div id="table-container">
        <h2>📋 Résultats de détection</h2>
        <table id="detections-table">
            <thead>
                <tr>
                    <th>Car ID</th>
                    <th>Car Score</th>
                    <th>Plaque</th>
                    <th>Plaque Score</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
    </div>

    <script>
    // --- WebSocket pour flux vidéo et détection ---
    const ws = new WebSocket("ws://localhost:8000/ws");
    const videoFrame = document.getElementById("video-frame");
    const fpsDisplay = document.getElementById("fps");
    const tableBody = document.getElementById("table-body");

    ws.onopen = () => console.log("Connecté au serveur WebSocket (vidéo)");
    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        document.getElementById("vehicle-count").textContent = `Véhicules détectés: ${data.vehicle_count}`;
        
        if (data.video) {
            videoFrame.src = "data:image/jpeg;base64," + data.video;
        }

        fpsDisplay.innerText = `FPS: ${data.fps.toFixed(2)} | Frame: ${data.frame_nmr}`;

        tableBody.innerHTML = "";
        data.detections.forEach(det => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${det.car_id}</td>
                <td>${det.car_detection_score}</td>
                <td>${det.license_number || "N/A"}</td>
                <td>${det.license_number_score || 0}</td>
            `;
            tableBody.appendChild(row);
        });
    };
    ws.onerror = (error) => console.error("WebSocket error:", error);
    ws.onclose = () => console.log("Déconnecté du serveur WebSocket (vidéo)");


    // --- WebSocket pour notifications d'infractions ---
    const wsNotif = new WebSocket("ws://localhost:8000/ws/notifications");
    const notifList = document.getElementById("notif-list");

    wsNotif.onopen = () => console.log("Connecté au serveur WebSocket (notifications)");
    wsNotif.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const p = document.createElement("p");
        p.textContent = `🚨 Véhicule ${data.car_id} - ${data.title} à ${data.created_at}`;
        notifList.prepend(p); // Ajouter en haut pour voir les plus récentes
    };
    wsNotif.onerror = (error) => console.error("WebSocket notifications error:", error);
    wsNotif.onclose = () => console.log("Déconnecté du serveur WebSocket (notifications)");
    </script>
</body>
</html>
